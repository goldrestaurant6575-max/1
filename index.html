<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070605;
    --panel:#14110c;
    --gold-1:#e9c873;
    --gold-2:#b8892f;
    --gold-3:#7a5a1c;
    --cream:#f4ecd8;
    --cream-dim:#cfc3a3;
    --emerald:#173a2e;
    --line: rgba(233,200,115,0.25);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--ink);
    font-family:'Jost', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND (placeholder for 3 videos) ---------- */
  .bg-stage{
    position:fixed;
    inset:0;
    z-index:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--ink);
  }

  .bg-split{
    position:relative;
    flex:1 1 0;
    width:100%;
    overflow:hidden;
  }
  .bg-split + .bg-split{
    border-top:1px solid rgba(233,200,115,0.35);
    box-shadow:0 -1px 12px rgba(0,0,0,0.5);
  }

  .bg-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  .bg-video.active{ opacity:1; }

  /* Ambient fallback shown while real videos aren't loaded yet */
  .bg-fallback{
    position:absolute;
    inset:-10%;
    background:
      radial-gradient(ellipse 40% 30% at 20% 20%, rgba(233,200,115,0.20), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 15%, rgba(184,137,47,0.18), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 90%, rgba(23,58,46,0.35), transparent 65%),
      linear-gradient(180deg, #0c0a07, #050403 70%);
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ transform: scale(1) translate(0,0); }
    100%{ transform: scale(1.15) translate(-2%, -3%); }
  }

  .bg-overlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(5,4,3,0.5) 0%, rgba(5,4,3,0.3) 30%, rgba(5,4,3,0.45) 78%, rgba(5,4,3,0.55) 100%);
  }

  .bg-vignette{
    position:absolute;
    inset:0;
    box-shadow: inset 0 0 12vw 3vw rgba(0,0,0,0.5);
  }

  /* ---------- LAYOUT ---------- */
  .page{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ---------- LOGO ---------- */
  .logo-wrap{
    position:relative;
    width:92px;
    height:92px;
    margin-bottom:14px;
  }

  .logo-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--gold-1), var(--gold-3), var(--gold-1), var(--gold-2), var(--gold-1));
    animation: spin 7s linear infinite;
    filter: blur(0.4px);
  }
  .logo-ring::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--ink);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .logo-glow{
    position:absolute;
    inset:-22px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(233,200,115,0.35), transparent 70%);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:0.5; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  .logo-circle{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#0c0a07;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:2;
    border:1px solid rgba(233,200,115,0.4);
  }

  .logo-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    border-radius:50%;
    display:block;
  }

  /* ---------- HEADING ---------- */
  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold-1);
    margin-bottom:8px;
    opacity:0.85;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:36px;
    line-height:1;
    text-align:center;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, #fbeecb, var(--gold-1) 55%, var(--gold-3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:20px;
  }

  /* ---------- SOCIAL ROW ---------- */
  .social-row{
    display:flex;
    gap:26px;
    margin-bottom:24px;
  }

  .social-btn{
    position:relative;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    box-shadow:none;
    color:var(--gold-1);
    text-decoration:none;
    transition:transform 0.2s ease, opacity 0.2s ease;
  }

  .social-btn:active{ transform:scale(0.9); opacity:0.7; }
  .social-btn svg{ width:30px; height:30px; position:relative; z-index:1; stroke-width:2; }

  /* ---------- ACTION BUTTONS ---------- */
  .btn-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .action-btn{
    position:relative;
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    border-radius:22px;
    background:rgba(0,0,0,0.08);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    backdrop-filter:blur(10px) saturate(140%);
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.18),
      inset 0 -6px 10px rgba(0,0,0,0.14),
      0 4px 12px rgba(0,0,0,0.22);
    color:var(--cream);
    text-decoration:none;
    overflow:hidden;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .action-btn:active{ transform:scale(0.98); }

  .action-btn::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    border-radius:26px 26px 60% 60%/26px 26px 20px 20px;
    background:linear-gradient(180deg, rgba(255,255,255,0.16), transparent);
    pointer-events:none;
  }

  .action-btn::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(233,200,115,0.25), transparent);
    transform:skewX(-20deg);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  .action-btn:nth-child(2)::before{ animation-delay:0.7s; }
  .action-btn:nth-child(3)::before{ animation-delay:1.4s; }
  .action-btn:nth-child(4)::before{ animation-delay:2.1s; }

  @keyframes shimmer{
    0%{ left:-60%; }
    45%{ left:120%; }
    100%{ left:120%; }
  }

  .action-icon{
    position:relative;
    flex:0 0 auto;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(0,0,0,0.1);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.25);
    z-index:1;
  }
  .action-icon svg{ width:16px; height:16px; color:var(--gold-1); }

  .action-label{
    font-size:14.5px;
    font-weight:500;
    letter-spacing:0.01em;
  }
  .action-sub{
    font-size:10.5px;
    color:var(--cream-dim);
    margin-top:0px;
  }

  .divider{
    width:100%;
    text-align:center;
    margin:24px 0 14px;
    font-size:10px;
    letter-spacing:0.3em;
    color:var(--gold-3);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }

  footer{
    margin-top:30px;
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.6;
    letter-spacing:0.05em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<div class="bg-stage">

  <div class="bg-split">

  <div class="divider">Gold Restaurant</div>

<script>
  // ----- 3 ta video bir vaqtda, 3 ustunga bo'lingan holda ishlaydi -----
  const videos = [document.getElementById('v1'), document.getElementById('v2'), document.getElementById('v3')];

  videos.forEach((v) => {
    v.addEventListener('loadeddata', () => {
      v.classList.add('active');
      v.play().catch(()=>{});
    });
    v.addEventListener('error', () => {
      v.closest('.bg-split').style.display = 'none';
    });
  });
</script>

</body>
</html>
